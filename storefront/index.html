<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Cartly — Explore</title>
  </head>
  <body>
    <style>
      /* Shown until the app mounts, so a slow connection never means a blank white page. */
      #app:empty { min-height: 100dvh; display: grid; place-items: center; }
      #app:empty::before { content: 'Cartly'; font: 600 26px/1 Inter, system-ui, sans-serif; letter-spacing: -0.03em; color: #1a1d21; }
      #app:empty::after { content: ''; width: 22px; height: 22px; margin-top: 64px; position: absolute; border: 3px solid #e4e6ea; border-top-color: #1f5bff; border-radius: 50%; animation: cartly-spin 0.8s linear infinite; }
      @keyframes cartly-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
