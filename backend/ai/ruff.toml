# Lint for the AI service: `ruff check app tests` (CI runs it). Formatting is not enforced.
target-version = "py312"
line-length = 140
extend-exclude = [".venv", ".models", "scripts/.autoresearch", "._*"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
  "E501",   # long lines: prompts and tables read better unwrapped
  "RUF001", "RUF002", "RUF003",  # Bangla, Hindi and curly quotes in strings and comments are the point
  "RUF012", # mutable class defaults are used deliberately for lookup tables
  "SIM108", # ternaries are not always clearer
  "B008",   # FastAPI's Header(default=None) in signatures
  "UP017",  # datetime.UTC: keep timezone.utc for readers used to it
  "E741",   # `l` for a layer or line is readable in context
  "B905",   # zip(strict=) adds noise where lengths are known equal
  "B007",   # unused loop variables in counting loops
  "SIM105", # try/except/pass with a comment beats contextlib.suppress
  "RUF007", # itertools.pairwise over zip of a slice: both read fine
  "ASYNC109", # a `timeout` argument passed on to the HTTP client is not a hidden wait
]

[lint.per-file-ignores]
"tests/*" = ["ASYNC", "B", "E731", "RUF059"]
