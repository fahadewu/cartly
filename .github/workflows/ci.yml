# Every check on every push and pull request:
#   api, ai, web   the test suites natively (fast, cached)
#   docker         the judge's path: build the whole stack, ./cartly up, ./cartly smoke, then ./cartly test
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://cartly:cartly@localhost:5432/cartly
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-jwt-secret-not-for-production
  INTERNAL_API_KEY: ci-internal-key
  PAYMENT_SECRETS_KEY: ci-payment-secrets-key-0123456789
  API_PORT: "4100"
  AI_PORT: "8001"
  UPLOAD_DIR: /tmp/cartly-uploads

jobs:
  api:
    name: API (NestJS) · lint, types, unit, e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cartly, POSTGRES_PASSWORD: cartly, POSTGRES_DB: cartly }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cartly" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/api/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Database schema and demo store (the e2e suites expect the test kit)
        run: |
          npx prisma migrate deploy
          npx tsx scripts/first-run.ts
      - run: npm run test:e2e
        env: { NODE_ENV: test }

  ai:
    name: AI service (FastAPI) · ruff, pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cartly, POSTGRES_PASSWORD: cartly, POSTGRES_DB: cartly }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cartly" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/api/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/ai/requirements.txt }
      - name: The API's schema and demo store (the AI tests read the Prisma tables)
        working-directory: backend/api
        run: |
          npm ci
          npx prisma migrate deploy
          npx tsx scripts/first-run.ts
      - name: Install
        working-directory: backend/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        working-directory: backend/ai
        run: ruff check app tests
      - name: Tests
        working-directory: backend/ai
        run: python -m pytest -q

  web:
    name: ${{ matrix.app }} · lint, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [storefront, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: "${{ matrix.app }}/package-lock.json" }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # A CI build is never a store: the test logins stay hidden.
          VITE_SHOW_TEST_ACCOUNTS: "false"

  docker:
    name: One command (Docker) · up, smoke, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: ./cartly up (build everything, set up the demo store, wait until healthy)
        run: ./cartly up
      - name: ./cartly smoke (pages, sign-in, Pip, festivals, Ask family, stamp card, admin)
        run: ./cartly smoke
      - name: ./cartly test (every suite, in Docker, on throwaway databases)
        run: ./cartly test
      - name: Logs, if something failed
        if: failure()
        run: docker compose logs --tail=200
